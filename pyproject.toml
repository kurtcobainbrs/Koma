[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koma-app"
version = "0.5.0"
description = "Editor desktop independente de storyboard e animatic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flet[desktop]==1.0.5", "platformdirs>=4,<5", "reportlab>=4.4,<5", "pillow>=11,<14", "miniaudio>=1.71,<2", "av==17.1.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7", "build>=1,<2", "pefile>=2024.8.26"]

[project.scripts]
koma = "koma.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
koma = ["assets/*.json", "assets/*.ico", "assets/fonts/*.ttf", "assets/fonts/OFL.txt", "themes/*.json"]
